# Quality gate for transit-jobs.
#
# GitHub Actions is unusable on this account (billing lock refuses to start
# jobs), so the same gate runs here: one job, one status check (`ci/quality`),
# on every branch push — which covers PR checks plus pushes to main and
# release/**. Mirrors the old .github/workflows/ci.yml exactly:
# npm ci -> db setup -> lint -> typecheck -> vitest -> build.
#
# One database service container backs two suites. The auth integration tests
# (real register/login/logout/role-authorization flows against `db/schema.ts`'s
# `users` table) and the schema/seed tests (geography round-trips, ON CONFLICT,
# check constraints, foreign-key restriction) both refuse to skip when CI is
# set, so a missing database fails the build rather than quietly reducing the
# gate. AUTH_SECRET is a fixed non-production value: it only needs to be stable
# across the job's own Auth.js instances, never reused outside CI.
version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.19.6
        environment:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/transit_jobs_test
          AUTH_SECRET: circleci-quality-gate-test-secret-do-not-reuse
      # postgis/postgis rather than cimg/postgres: the schema tests need the
      # PostGIS extension, which cimg/postgres does not ship. The image is a
      # superset of stock Postgres, so the auth suite runs against it unchanged
      # — one container serves both rather than either side losing its database.
      - image: postgis/postgis:16-3.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transit_jobs_test
    steps:
      - checkout

      # No dependency caches, deliberately: every stored cache archive counts
      # against the CircleCI storage quota (project hit ~50% on 2026-09-03).
      # The old node_modules archive was worse than useless — `npm ci`
      # deletes node_modules at the start of every install, so the restored
      # copy was pure quota. A full `npm ci` from the registry is ~1 minute
      # slower and costs zero storage. When the E2E job lands (T9), add back
      # exactly one cache: Playwright browsers, keyed on the installed
      # browser version, never a per-run key.
      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 30); do
              nc -z localhost 5432 && echo "postgres is up" && exit 0
              sleep 2
            done
            echo "postgres did not become available" >&2
            exit 1

      - run:
          name: Prepare test database
          # Enables the PostGIS extension, then pushes the schema with --force:
          # the CI database is disposable, and the prompt would otherwise hang.
          command: npm run db:setup:ci

      - run:
          name: Lint
          command: npm run lint

      - run:
          name: Typecheck
          command: npm run typecheck

      - run:
          name: Unit, database and integration tests
          command: npm run test

      - run:
          name: Build
          command: npm run build

workflows:
  quality-gate:
    jobs:
      - quality
